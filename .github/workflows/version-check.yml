name: Version check

on:
  pull_request:
    branches: [main]

jobs:
  version-increased:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version number was increased
        run: .github/scripts/check-version.sh "origin/${{ github.base_ref }}"
