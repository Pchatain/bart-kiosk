name: Layout tests

on:
  pull_request:
    branches: [main]

jobs:
  layout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Screenshots of the Fire HD 8 layout and the HTML report, for a human to look at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-report
          path: tests/playwright-report/
          retention-days: 14
