<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://api.bart.gov https://api.open-meteo.com https://api.tidesandcurrents.noaa.gov; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fruitvale BART Departures</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #141e33;
    --text: #f2f6ff;
    --muted: #8da2c0;
    --accent: #4da3ff;
    --minor: #ffe08a;   /* 3-4 min late */
    --major: #ff4d4f;   /* 5+ min late */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vmin 3vw 1vmin;
  }
  header h1 {
    font-size: 5vmin;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  .title { display: flex; align-items: center; gap: 1.6vmin; }
  /* Tap to switch between trains and weather (for 5 minutes). */
  #screen-toggle {
    width: 7vmin; height: 7vmin;
    padding: 1.1vmin;
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 1.4vmin;
    background: var(--panel);
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  #screen-toggle svg { width: 100%; height: 100%; display: block; }
  #screen-toggle .to-trains, body.show-weather #screen-toggle .to-weather { display: none; }
  body.show-weather #screen-toggle .to-trains { display: block; }
  main[hidden], #weather[hidden] { display: none; }
  body.show-weather #ticker { display: none; }
  #clock {
    font-size: 4.5vmin;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  /* ---- Platforms and the draggable divider ---- */
  main {
    /* --split: Platform 1's share of the width (0.4 = 40%). Set by dragging the divider. */
    --split: 0.4;
    --div-space: 4vmin;    /* divider width + its margins */
    flex: 1;
    display: flex;
    padding: 0 2vw 1vmin;
    min-height: 0;
    transition: opacity 0.5s;
  }
  /* Data hasn't updated for a while: fade the board (the footer says how old it is). */
  main.stale { opacity: 0.45; filter: grayscale(1); }
  .platform {
    flex: 1 1 0;
    min-width: 0;
    background: var(--panel);
    border-radius: 1.5vmin;
    padding: 1.5vmin 1.5vw;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .platform.p1 { flex: 0 0 calc((100% - var(--div-space)) * var(--split)); }
  #divider {
    flex: 0 0 1.6vmin;
    margin: 0 1.2vmin;
    background: #2f4268;
    border-radius: 0.8vmin;
    position: relative;
    cursor: col-resize;
    touch-action: none;
    user-select: none;
  }
  /* Wider invisible touch target so the divider is easy to grab. */
  #divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2.5vmin; right: -2.5vmin; }
  /* Grip mark in the middle. */
  #divider::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 0.5vmin; height: 9vmin;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.45);
    border-radius: 0.2vmin;
  }
  #divider.dragging, #divider:focus-visible { background: var(--accent); outline: none; }

  /* ---- Columns ---- */
  .cols {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  /* Thin gray line between the two columns in each half. */
  .col:first-child { padding-right: 1.2vw; border-right: 2px solid transparent; }   /* same width as the bordered column */
  .col + .col { padding-left: 1.2vw; border-left: 2px solid rgba(255,255,255,0.14); }
  .col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .col-head .plat { color: var(--accent); margin-right: 0.5em; }
  .col-head {
    font-size: 2.8vmin;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-bottom: 0.6vmin;
    border-bottom: 2px solid rgba(255,255,255,0.12);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Number sizing ----
     Each column is a size container, so its numbers can be sized from its own
     height and width (cqh/cqw). The script only sets, per platform:
       --rows   how many rows to fit (3 or 4)
       --ratio  how wide a row is in "number font sizes": 1.3 fits "88";
                2.0 also leaves room for a "+N" late badge
       --fit    a correction factor (normally 1) if the result still overflows,
                e.g. because of a browser text-zoom setting
     Browsers without container units get --num-base/--now-base set in pixels
     by the script, using the same formula (see sizeWithoutContainerUnits). */
  .trains {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    container-type: size;
    --side: calc(3.6vmin + 0.8vw);   /* dot + gap */
    /* Largest number that fits --rows rows (row = 0.95 x font + 1.6vmin padding + 1px line)
       and fits the column width. */
    --num-base: min((100cqh / var(--rows, 3) - 1.6vmin - 1px) / 0.95,
                    (100cqw - var(--side)) / var(--ratio, 1.3));
    /* "Now" is about 1.75x wider than "88", so it gets its own size. */
    --now-base: min(var(--num-base) * 0.72, (100cqw - var(--side)) / 2.3);
    --num: calc(var(--num-base) * var(--fit, 1));
    --now: calc(var(--now-base) * var(--fit, 1));
  }
  .train {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    padding: 0.8vmin 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .train:last-child { border-bottom: none; }
  .line-dot {
    width: 3.6vmin;
    height: 3.6vmin;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.35);
  }
  .dest {
    flex: 1;
    min-width: 0;
    font-size: 4.4vmin;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Each number sits right next to its dot, in a slot two digits wide and
     right-aligned, so "9" lines up under the "6" of "16". */
  .mins {
    min-width: 2ch;
    flex-shrink: 0;
    font-size: var(--num);
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .mins.leaving { color: #ffd34d; font-size: var(--now); }
  /* Late trains (3+ min): an outline around the number plus a "+N" badge beside
     it, both light yellow for 3-4 min late and red for 5+. */
  .mins.late { box-shadow: 0 0 0 0.045em var(--late-color); border-radius: 0.14em; padding: 0 0.06em; }
  .mins.late.minor { --late-color: var(--minor); }
  .mins.late.major { --late-color: var(--major); }
  .late-badge {
    align-self: flex-start;
    font-size: calc(var(--num) * 0.26);
    font-weight: 800;
    line-height: 1;
    padding: 0.18em 0.42em;
    border-radius: 999px;
    white-space: nowrap;
  }
  .late-badge.minor { background: var(--minor); color: #3a2a00; }
  .late-badge.major { background: var(--major); color: #fff; }
  .empty {
    font-size: 2.8vmin;
    color: var(--muted);
    padding: 3vmin 0;
    text-align: center;
  }

  /* ---- Ticker: scrolling messages above the footer; hidden when there's nothing to say ---- */
  #ticker {
    flex: 0 0 auto;
    margin: 0 2vw;
    padding: 0.8vmin 1.5vw;
    overflow: hidden;
    white-space: nowrap;
    font-size: 4.6vmin;
    font-weight: 700;
    color: #ffd34d;
    background: rgba(255,211,77,0.08);
    border-top: 2px solid rgba(255,211,77,0.35);
    border-radius: 1vmin;
  }
  #ticker[hidden] { display: none; }
  #ticker-text { display: inline-block; will-change: transform; }

  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 2vw;
    padding: 0.8vmin 3vw 1.2vmin;
    font-size: 1.8vmin;
    color: var(--muted);
  }
  footer .tag { letter-spacing: 0.15em; }
  footer .right { text-align: right; }
  #status.problem { color: #ff8a80; }
  #version { margin-left: 1em; opacity: 0.6; }

  /* ---- Weather screen ---- */
  #weather {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 2vmin;
    padding: 0 2vw 1vmin;
  }
  .wx-card {
    background: var(--panel);
    border-radius: 1.5vmin;
    padding: 1.5vmin 1.5vw;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .wx-tides { grid-row: 1 / span 2; }
  .wx-label {
    font-size: 2.8vmin;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-bottom: 0.6vmin;
    border-bottom: 2px solid rgba(255,255,255,0.12);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-headline { font-size: 4.4vmin; font-weight: 800; margin-top: 1vmin; line-height: 1.15; }
  .wx-detail { font-size: 2.8vmin; color: var(--muted); margin-top: 0.6vmin; line-height: 1.3; }
  .wx-detail b { color: var(--text); font-weight: 700; }
  .wx-big { font-size: 9vmin; font-weight: 800; line-height: 1; margin-top: 1vmin; font-variant-numeric: tabular-nums; }
  .wx-message { font-size: 3vmin; color: var(--muted); margin-top: 1.5vmin; }
  .wx-message.problem { color: #ff8a80; }
  .tide-chart { flex: 1; min-height: 12vmin; margin-top: 1vmin; position: relative; }
  .tide-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tide-events { font-size: 2.6vmin; color: var(--muted); margin-top: 0.8vmin; line-height: 1.4; }
  .tide-events b { color: var(--text); }
  .tide-events span { white-space: nowrap; }
  .rain-bars {
    flex: 1;
    min-height: 6vmin;
    display: flex;
    align-items: stretch;
    gap: 0.25vw;
    margin-top: 1.2vmin;
  }
  .rain-bar { flex: 1; display: flex; align-items: flex-end; background: rgba(77,163,255,0.08); border-radius: 0.4vmin 0.4vmin 0 0; }
  .rain-bar i { display: block; width: 100%; border-radius: 0.4vmin 0.4vmin 0 0; background: rgba(77,163,255,0.35); }
  .rain-bar.possible i { background: rgba(77,163,255,0.7); }
  .rain-bar.likely i { background: #4da3ff; }
  .rain-hours { display: flex; gap: 0.25vw; font-size: 2vmin; color: var(--muted); margin-top: 0.4vmin; }
  .rain-hours span { flex: 1; white-space: nowrap; overflow: visible; }

  /* Portrait screens: stack the platforms; the divider drags up and down. */
  @media (orientation: portrait) {
    main { flex-direction: column; }
    .platform.p1 { flex-basis: calc((100% - var(--div-space)) * var(--split)); }
    #divider { margin: 1.2vmin 0; cursor: row-resize; }
    #divider::before { left: 0; right: 0; top: -2.5vmin; bottom: -2.5vmin; }
    #divider::after { width: 9vmin; height: 0.5vmin; }
    #weather { grid-template-columns: 1fr; grid-template-rows: 1.4fr auto auto; }
    .wx-tides { grid-row: auto; }
  }
</style>
</head>
<body>
  <header>
    <div class="title">
      <button id="screen-toggle" type="button" aria-label="Show weather">
        <svg class="to-weather" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="9" cy="9" r="3.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/>
          <path d="M11 20.5h8a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 11 20.5z" fill="var(--panel)"/>
        </svg>
        <svg class="to-trains" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="2.5" width="14" height="15" rx="3"/><path d="M5 10h14M9 21.5l-2-4M15 21.5l2-4"/><circle cx="9" cy="14" r="0.8" fill="currentColor"/><circle cx="15" cy="14" r="0.8" fill="currentColor"/>
        </svg>
      </button>
      <h1>Fruitvale <span id="title-word">BART</span></h1>
    </div>
    <div id="clock">--:--</div>
  </header>
  <main>
    <section class="platform p1" data-platform="1" aria-label="Platform 1">
      <div class="cols">
        <div class="col"><div class="col-head"><span class="plat">#1</span><span class="name" data-full="Berryessa" data-short="BERY">Berryessa</span></div><div class="trains" id="col-bery"><div class="empty">Loading&hellip;</div></div></div>
        <div class="col"><div class="col-head"><span class="plat">#1</span><span class="name" data-full="Dublin" data-short="DUB">Dublin</span></div><div class="trains" id="col-dub"><div class="empty">Loading&hellip;</div></div></div>
      </div>
    </section>
    <div id="divider" role="separator" aria-label="Drag to resize platforms" tabindex="0"></div>
    <section class="platform p2" data-platform="2" aria-label="Platform 2">
      <div class="cols">
        <div class="col"><div class="col-head"><span class="plat">#2</span><span class="name" data-full="San Francisco" data-short="SF">San Francisco</span></div><div class="trains" id="col-sf"><div class="empty">Loading&hellip;</div></div></div>
        <div class="col"><div class="col-head"><span class="plat">#2</span><span class="name" data-full="Richmond" data-short="RICH">Richmond</span></div><div class="trains" id="col-rich"><div class="empty">Loading&hellip;</div></div></div>
      </div>
    </section>
  </main>
  <section id="weather" hidden aria-label="Weather and tides">
    <div class="wx-card wx-tides">
      <div class="wx-label" id="tide-label">Tides during practice</div>
      <div id="tide-body"><div class="wx-message">Loading tides&hellip;</div></div>
      <div class="tide-chart" id="tide-chart"></div>
      <div class="tide-events" id="tide-events"></div>
    </div>
    <div class="wx-card wx-sun">
      <div class="wx-label">Sunrise</div>
      <div id="sun-body"></div>
    </div>
    <div class="wx-card wx-rain">
      <div class="wx-label">Rain &middot; next 24 hours</div>
      <div id="rain-body"><div class="wx-message">Loading forecast&hellip;</div></div>
      <div class="rain-bars" id="rain-bars"></div>
      <div class="rain-hours" id="rain-hours"></div>
    </div>
  </section>
  <div id="ticker" hidden aria-live="polite"><span id="ticker-text"></span></div>
  <footer>
    <div id="footer-note">Departures within the next 60 minutes</div>
    <div class="tag">GCCRCNPO!</div>
    <!-- Increase the version number in every pull request; a GitHub check fails if it isn't. -->
    <div class="right"><span id="status">Updating&hellip;</span><span id="version">v10</span></div>
  </footer>

<script>
"use strict";

// =============================================================================
// Settings
// =============================================================================
// BART's published public demo key. Anything in client-side JS is public; don't put a private key here.
const BART_KEY = "MW9S-E7SL-26DU-VV8V";
const DEPARTURES_URL = `https://api.bart.gov/api/etd.aspx?cmd=etd&orig=FTVL&key=${BART_KEY}&json=y`;
const ADVISORIES_URL = `https://api.bart.gov/api/bsa.aspx?cmd=bsa&key=${BART_KEY}&json=y`;

const TIME_ZONE = "America/Los_Angeles";   // show Bay Area time even if the tablet's zone is wrong
const MAX_MINUTES = 60;                    // ignore trains further out than this
const DEPARTURES_EVERY_MS = 30 * 1000;
const ADVISORIES_EVERY_MS = 60 * 1000;
const UPDATE_CHECK_EVERY_MS = 5 * 60 * 1000;
const REQUEST_TIMEOUT_MS = 10 * 1000;
const STALE_AFTER_FAILURES = 3;            // fade the board after this many failed refreshes in a row

const LATE_THRESHOLD_MIN = 3;              // delays of 2 min or less are ignored
const MAJOR_DELAY_MIN = 5;                 // 3-4 min late: light yellow; 5+: red
const TICKER_SPEED_VMIN_PER_S = 14;        // ticker speed, in % of the screen's shorter side per second

// Rows each platform is sized for, from its busiest column: BART usually sends
// 3 trains per destination, sometimes more when two lines share a column.
const MIN_ROWS = 3;
const MAX_ROWS = 4;
const WIDTH_RATIO = 1.3;                   // row width in number-font-sizes: fits "88"
const WIDTH_RATIO_WITH_BADGE = 2.0;        // ...plus a "+N" late badge

// Weather screen
const LOCATION = { lat: 37.78, lon: -122.24 };               // Oakland Estuary by Fruitvale
const WEATHER_HOURS = { from: 5 * 60, until: 7 * 60 };       // show weather 5:00-7:00 AM, every day
const PRACTICE_HOURS = { from: 6 * 60 + 30, until: 8 * 60 + 30 };
const TIDE_CHART_HOURS = { from: 4 * 60, until: 11 * 60 };   // time range drawn on the tide chart
const MANUAL_SWITCH_MS = 5 * 60 * 1000;                      // a tap on the icon lasts this long
const WEATHER_EVERY_MS = 15 * 60 * 1000;
const TIDES_EVERY_MS = 3 * 60 * 60 * 1000;
const RAIN_POSSIBLE_PCT = 30;                                 // an hour at or above this counts as rain
const RAIN_LIKELY_PCT = 60;
const WEATHER_STALE_MS = 60 * 60 * 1000;                      // say "as of" when older than this

const DEFAULT_SPLIT = 0.4;                 // Platform 1's default share of the width
const SPLIT_KEY = "kiosk-split";

// Short codes for destinations, keyed by the name the BART API returns.
const SHORT_NAMES = {
  "Berryessa": "BERY",
  "Berryessa/North San Jose": "BERY",
  "Dublin/Pleasanton": "DUB",
  "Daly City": "DALY",
  "Richmond": "RICH"
};

// Which column each train goes in. A train goes in the first column on its
// platform that lists its destination; anything unlisted goes in that
// platform's fallback column and shows its name (the only rows that do).
const COLUMNS = [
  { id: "col-bery", platform: "1", dests: ["Berryessa", "Berryessa/North San Jose"], fallback: true },
  { id: "col-dub",  platform: "1", dests: ["Dublin/Pleasanton"] },
  { id: "col-sf",   platform: "2", dests: ["Daly City", "SF Airport"], fallback: true },
  { id: "col-rich", platform: "2", dests: ["Richmond"] }
];
const PLATFORMS = ["1", "2"];

// Container units (cqw/cqh) let CSS do the sizing. Older browsers get the same
// formula computed in the script. "?nocq" in the address forces that path, for testing.
const USE_CONTAINER_UNITS = CSS.supports("height: 1cqh") && !/[?&]nocq\b/.test(location.search);
// "?screen=weather" or "?screen=trains" in the address pins a screen (for testing).
const PINNED_SCREEN = (location.search.match(/[?&]screen=(weather|trains)\b/) || [])[1] || null;

// =============================================================================
// State: everything the screen shows comes from here
// =============================================================================
const state = {
  departures: null,    // { byColumn: {colId: [train]}, fetchedAt } from the last successful refresh
  failures: 0,         // failed departure refreshes in a row
  advisories: [],      // BART service advisory texts
  weather: null,       // { current, hourly, fetchedAt } from the weather provider
  weatherFailed: false,
  tides: null,         // { events, curve, fetchedAt } from the tide provider
  tidesFailed: false,
  manual: null,        // { screen, until } after a tap on the icon
  shownScreen: null
};

// =============================================================================
// Time helpers: everything is shown in TIME_ZONE (Bay Area time)
// =============================================================================
const zoneFormat = new Intl.DateTimeFormat("en-US", {
  timeZone: TIME_ZONE, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", hourCycle: "h23"
});

// { year, month, day, hour, minute } of a moment, in Bay Area time.
function zoneParts(ms) {
  const p = {};
  for (const { type, value } of zoneFormat.formatToParts(new Date(ms))) p[type] = parseInt(value, 10);
  return { year: p.year, month: p.month, day: p.day, hour: p.hour % 24, minute: p.minute };
}

// The moment (ms) that's the given Bay Area date and time.
function zonedTime(year, month, day, hour = 0, minute = 0) {
  const wanted = Date.UTC(year, month - 1, day, hour, minute);
  let t = wanted;
  for (let i = 0; i < 3; i++) {
    const p = zoneParts(t);
    t += wanted - Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute);
  }
  return t;
}

const minutesOfDay = ms => { const p = zoneParts(ms); return p.hour * 60 + p.minute; };
const sameDay = (a, b) => { const p = zoneParts(a), q = zoneParts(b); return p.year === q.year && p.month === q.month && p.day === q.day; };
const atMinutes = (day, minutes) => zonedTime(day.year, day.month, day.day, Math.floor(minutes / 60), minutes % 60);

// =============================================================================
// Data: fetch from BART and turn it into plain objects (no DOM here)
// =============================================================================
async function fetchJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(url, { cache: "no-store", signal: controller.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function columnFor(platform, destination) {
  const onPlatform = COLUMNS.filter(c => c.platform === platform);
  return onPlatform.find(c => c.dests.includes(destination)) ||
         onPlatform.find(c => c.fallback) || null;
}

// BART reports each train's delay in seconds. Returns whole minutes late
// (rounded), or 0 if that's under the threshold.
function lateMinutes(delaySeconds) {
  const min = Math.round((parseInt(delaySeconds, 10) || 0) / 60);
  return min >= LATE_THRESHOLD_MIN ? min : 0;
}

// Returns { byColumn: {colId: [{destination, shortName, showDest, minutes, lateMin, color}]} }.
async function fetchDepartures() {
  const data = await fetchJson(DEPARTURES_URL);
  const etds = (data.root.station && data.root.station[0] && data.root.station[0].etd) || [];
  const byColumn = {};
  for (const c of COLUMNS) byColumn[c.id] = [];
  for (const etd of etds) {
    for (const est of etd.estimate) {
      if (est.cancelflag === "1") continue;
      const minutes = est.minutes === "Leaving" ? 0 : parseInt(est.minutes, 10);
      if (isNaN(minutes) || minutes > MAX_MINUTES) continue;
      const col = columnFor(est.platform, etd.destination);
      if (!col) continue;
      byColumn[col.id].push({
        destination: etd.destination,
        shortName: SHORT_NAMES[etd.destination] || etd.destination,
        showDest: !col.dests.includes(etd.destination),
        minutes,
        lateMin: lateMinutes(est.delay),
        color: /^#[0-9a-fA-F]{3,8}$/.test(est.hexcolor) ? est.hexcolor : "#888"
      });
    }
  }
  for (const c of COLUMNS) byColumn[c.id].sort((a, b) => a.minutes - b.minutes);
  return { byColumn };
}

// Returns a list of advisory texts (empty when BART says there are none).
async function fetchAdvisories() {
  const data = await fetchJson(ADVISORIES_URL);
  return [].concat((data.root && data.root.bsa) || [])
    .map(a => ((a.description && a.description["#cdata-section"]) || "").trim())
    .filter(text => text && !/^no advisories/i.test(text));
}

// =============================================================================
// Weather provider. To switch weather services, replace this object: the
// screen only uses what fetchForecast() returns.
// =============================================================================
const weatherProvider = {
  name: "Open-Meteo",
  // Returns { current: { tempF, windMph, windFromDeg }, hourly: [{ time, rainPct, rainIn }] }, times in ms.
  async fetchForecast() {
    const d = await fetchJson("https://api.open-meteo.com/v1/forecast" +
      `?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}` +
      "&current=temperature_2m,wind_speed_10m,wind_direction_10m" +
      "&hourly=precipitation_probability,precipitation" +
      "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch" +
      "&timeformat=unixtime&timezone=GMT&forecast_days=3");
    return {
      current: { tempF: d.current.temperature_2m, windMph: d.current.wind_speed_10m, windFromDeg: d.current.wind_direction_10m },
      hourly: d.hourly.time.map((t, i) => ({
        time: t * 1000,
        rainPct: d.hourly.precipitation_probability[i] || 0,
        rainIn: d.hourly.precipitation[i] || 0
      }))
    };
  }
};

// =============================================================================
// Tide provider: NOAA predictions for Alameda, the nearest station to the estuary.
// =============================================================================
const tideProvider = {
  name: "NOAA, Alameda",
  station: "9414750",
  // Returns { events: [{ time, type: "high" | "low", ft }], curve: [{ time, ft }] } covering about 3 days.
  async fetchTides() {
    const p = zoneParts(Date.now());
    const begin = `${p.year}${String(p.month).padStart(2, "0")}${String(p.day).padStart(2, "0")}`;
    const url = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions" +
      `&station=${this.station}&begin_date=${begin}&range=72&datum=MLLW&units=english` +
      "&time_zone=gmt&format=json&application=fruitvale_kiosk";
    const [hilo, curve] = await Promise.all([fetchJson(url + "&interval=hilo"), fetchJson(url + "&interval=6")]);
    const time = t => Date.parse(t.replace(" ", "T") + ":00Z");
    return {
      events: hilo.predictions.map(x => ({ time: time(x.t), type: x.type === "H" ? "high" : "low", ft: parseFloat(x.v) })),
      curve: curve.predictions.map(x => ({ time: time(x.t), ft: parseFloat(x.v) }))
    };
  }
};

// Sunrise, sunset and first light (civil dawn: sun 6 degrees below the horizon),
// computed here with the standard sunrise equation. Accurate to about a minute.
function sunTimes(day) {
  const rad = Math.PI / 180, { lat, lon } = LOCATION;
  const jd = zonedTime(day.year, day.month, day.day, 12) / 86400000 + 2440587.5;
  const jStar = Math.round(jd - 2451545.0 + lon / 360) - lon / 360;
  const M = (357.5291 + 0.98560028 * jStar) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lambda = (M + C + 180 + 102.9372) % 360;
  const transit = 2451545.0 + jStar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lambda * rad);
  const sinDec = Math.sin(lambda * rad) * Math.sin(23.4397 * rad);
  const cosDec = Math.cos(Math.asin(sinDec));
  const hourAngle = altitude =>
    Math.acos((Math.sin(altitude * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec)) / rad;
  const toMs = j => (j - 2440587.5) * 86400000;
  const rise = hourAngle(-0.833), civil = hourAngle(-6);
  return { firstLight: toMs(transit - civil / 360), sunrise: toMs(transit - rise / 360), sunset: toMs(transit + rise / 360) };
}

// =============================================================================
// Updates: fetch, store in state, redraw
// =============================================================================
async function updateDepartures() {
  try {
    const { byColumn } = await fetchDepartures();
    state.departures = { byColumn, fetchedAt: Date.now() };
    state.failures = 0;
  } catch (err) {
    state.failures++;
    console.log("Departures error:", err.message);
  }
  render();
}

async function updateWeather() {
  try {
    state.weather = { ...(await weatherProvider.fetchForecast()), fetchedAt: Date.now() };
    state.weatherFailed = false;
  } catch (err) {
    state.weatherFailed = true;
    console.log("Weather error:", err.message);   // keep the previous forecast
  }
  render();
}

async function updateTides() {
  try {
    state.tides = { ...(await tideProvider.fetchTides()), fetchedAt: Date.now() };
    state.tidesFailed = false;
  } catch (err) {
    state.tidesFailed = true;
    console.log("Tides error:", err.message);
  }
  render();
}

async function updateAdvisories() {
  try {
    state.advisories = await fetchAdvisories();
  } catch (err) {
    console.log("Advisories error:", err.message);   // keep the previous ones
  }
  render();
}

// =============================================================================
// Rendering
// =============================================================================
function formatTime(date, withSeconds) {
  return date.toLocaleTimeString([], {
    hour: "numeric", minute: "2-digit", second: withSeconds ? "2-digit" : undefined, timeZone: TIME_ZONE
  });
}

function div(className, text) {
  const d = document.createElement("div");
  d.className = className;
  if (text !== undefined) d.textContent = text;
  return d;
}

// Trains per column as of now: if the data is a few minutes old (BART not
// responding), count the minutes down and drop trains that have left.
function currentTrains() {
  if (!state.departures) return null;
  const elapsed = Math.floor((Date.now() - state.departures.fetchedAt) / 60000);
  const out = {};
  for (const c of COLUMNS) {
    out[c.id] = state.departures.byColumn[c.id]
      .map(t => ({ ...t, minutes: t.minutes - elapsed }))
      .filter(t => t.minutes >= 0);
  }
  return out;
}

function renderRow(t) {
  const row = div("train");
  const dot = div("line-dot");
  dot.style.background = t.color;
  const mins = t.minutes === 0 ? div("mins leaving", "Now") : div("mins", String(t.minutes));
  const parts = t.showDest ? [dot, div("dest", t.shortName), mins] : [dot, mins];
  if (t.lateMin) {
    const severity = t.lateMin >= MAJOR_DELAY_MIN ? "major" : "minor";
    mins.classList.add("late", severity);
    parts.push(div("late-badge " + severity, "+" + t.lateMin));
  }
  row.append(...parts);
  return row;
}

function renderBoard(trains) {
  for (const platform of PLATFORMS) {
    const platEl = document.querySelector(`.platform[data-platform="${platform}"]`);
    const columns = COLUMNS.filter(c => c.platform === platform);
    const busiest = Math.max(...columns.map(c => trains[c.id].length));
    const rows = Math.min(MAX_ROWS, Math.max(MIN_ROWS, busiest));
    const shown = columns.map(c => trains[c.id].slice(0, rows));
    const hasBadge = shown.some(list => list.some(t => t.lateMin));
    platEl.style.setProperty("--rows", rows);
    platEl.style.setProperty("--ratio", hasBadge ? WIDTH_RATIO_WITH_BADGE : WIDTH_RATIO);
    columns.forEach((c, i) => {
      const el = document.getElementById(c.id);
      el.replaceChildren(...(shown[i].length ? shown[i].map(renderRow) : [div("empty", "No trains")]));
    });
  }
}

// Worst delays first, then BART's advisories.
function tickerMessages(trains) {
  const late = trains ? Object.values(trains).flat().filter(t => t.lateMin) : [];
  const delays = late
    .sort((a, b) => b.lateMin - a.lateMin || a.minutes - b.minutes)
    .map(t => `${t.destination} train ${t.minutes === 0 ? "leaving now" : "in " + t.minutes + " min"} is running ${t.lateMin} min late`);
  return [...delays, ...state.advisories.map(a => "BART: " + a)];
}

// =============================================================================
// Which screen: weather 5-7 AM, trains otherwise; a tap switches for 5 minutes
// =============================================================================
function scheduledScreen(now) {
  const m = minutesOfDay(now);
  return m >= WEATHER_HOURS.from && m < WEATHER_HOURS.until ? "weather" : "trains";
}

function activeScreen(now = Date.now()) {
  if (PINNED_SCREEN) return PINNED_SCREEN;
  if (state.manual && now < state.manual.until) return state.manual.screen;
  return scheduledScreen(now);
}

function toggleScreen() {
  const now = Date.now();
  const next = activeScreen(now) === "weather" ? "trains" : "weather";
  // Switching back to what the schedule says ends the manual switch.
  state.manual = next === scheduledScreen(now) ? null : { screen: next, until: now + MANUAL_SWITCH_MS };
  render();
}

function renderScreenChrome(screen) {
  const weather = screen === "weather";
  document.body.classList.toggle("show-weather", weather);
  document.querySelector("main").hidden = weather;
  document.getElementById("weather").hidden = !weather;
  document.getElementById("title-word").textContent = weather ? "Weather" : "BART";
  document.getElementById("screen-toggle").setAttribute("aria-label", weather ? "Show trains" : "Show weather");
  document.getElementById("footer-note").textContent = weather
    ? `Weather: ${weatherProvider.name} \u00b7 Tides: ${tideProvider.name}`
    : "Departures within the next 60 minutes";
}

function renderStatus() {
  const status = document.getElementById("status");
  const stale = state.failures >= STALE_AFTER_FAILURES && state.departures;
  document.querySelector("main").classList.toggle("stale", !!stale);
  status.classList.toggle("problem", state.failures > 0);
  if (!state.departures && state.failures === 0) {
    status.textContent = "Updating…";
  } else if (state.failures === 0) {
    status.textContent = "Updated " + formatTime(new Date(state.departures.fetchedAt), true);
  } else if (stale) {
    status.textContent = "Data from " + formatTime(new Date(state.departures.fetchedAt), false) + " — retrying";
  } else {
    status.textContent = "Update failed — retrying";
  }
}

function renderWeatherStatus() {
  const status = document.getElementById("status");
  const failed = state.weatherFailed || state.tidesFailed;
  status.classList.toggle("problem", failed);
  status.textContent = failed ? "Weather update failed \u2014 retrying"
    : state.weather ? "Weather updated " + formatTime(new Date(state.weather.fetchedAt), false)
    : "Updating\u2026";
}

function render() {
  const screen = activeScreen();
  state.shownScreen = screen;
  renderScreenChrome(screen);
  const trains = currentTrains();
  if (trains) renderBoard(trains);
  setTicker(tickerMessages(trains));
  renderStatus();
  if (screen === "weather") {
    renderWeatherStatus();
    renderWeather(Date.now());
  } else {
    fitAll();
  }
}

// =============================================================================
// Weather screen
// =============================================================================
const shortTime = ms => formatTime(new Date(ms), false);
// "1 PM" for whole hours, "1:30 PM" otherwise.
const hourTime = ms => zoneParts(ms).minute ? shortTime(ms)
  : new Date(ms).toLocaleTimeString([], { hour: "numeric", timeZone: TIME_ZONE });
const feet = v => (v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(1) + " ft";

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

// The date of the next practice: today until practice ends, then tomorrow.
function practiceDay(now) {
  return minutesOfDay(now) < PRACTICE_HOURS.until ? zoneParts(now) : zoneParts(now + 24 * 3600 * 1000);
}

function tideAt(curve, t) {
  for (let i = 1; i < curve.length; i++) {
    if (curve[i].time >= t) {
      const a = curve[i - 1], b = curve[i];
      return a.ft + (b.ft - a.ft) * (t - a.time) / (b.time - a.time);
    }
  }
  return null;
}

// What the tide does during practice, in words.
function tideSummary(tides, start, end) {
  const turn = tides.events.find(e => e.time >= start && e.time <= end);
  const h1 = tideAt(tides.curve, start), h2 = tideAt(tides.curve, end);
  const headline = turn
    ? (turn.type === "high" ? `High tide at ${shortTime(turn.time)}: rising, then falling`
                            : `Low tide at ${shortTime(turn.time)}: falling, then rising`)
    : (h2 > h1 ? "Rising all practice" : "Falling all practice");
  const detail = h1 === null || h2 === null ? ""
    : `${shortTime(start)} <b>${feet(h1)}</b> \u2192 ${shortTime(end)} <b>${feet(h2)}</b>`;
  return { headline, detail };
}

// Hours of rain in the next 24 hours, in words.
function rainSummary(hourly, now) {
  const start = now - (now % 3600000);
  const hours = hourly.filter(h => h.time >= start && h.time < start + 24 * 3600000);
  const max = Math.max(0, ...hours.map(h => h.rainPct));
  const windows = [];
  for (const h of hours) {
    const last = windows[windows.length - 1];
    if (h.rainPct < RAIN_POSSIBLE_PCT) continue;
    if (last && h.time - last[last.length - 1].time <= 3600000) last.push(h); else windows.push([h]);
  }
  const when = t => {
    const p = zoneParts(t);
    if (!sameDay(t, now)) return p.hour < 6 ? "overnight " : "tomorrow ";
    return p.hour >= 18 && minutesOfDay(now) < 18 * 60 ? "tonight " : "";
  };
  const range = w => {
    const from = w[0].time, to = w[w.length - 1].time + 3600000;
    return (from <= start ? "now" : when(from) + hourTime(from)) + " \u2013 " + hourTime(to);
  };
  if (!windows.length) {
    return { hours, headline: "No rain expected", detail: `Chance stays at or below <b>${max}%</b> all day and tonight` };
  }
  const first = windows[0];
  const peak = Math.max(...first.map(h => h.rainPct));
  const total = hours.reduce((sum, h) => sum + h.rainIn, 0);
  const detail = [`Up to <b>${peak}%</b> chance`];
  if (total >= 0.01) detail.push(`about <b>${total.toFixed(2)} in</b> total`);
  if (windows.length > 1) detail.push(`again ${range(windows[1])}`);
  return { hours, headline: `Rain ${peak >= RAIN_LIKELY_PCT ? "likely" : "possible"} ${range(first)}`, detail: detail.join(" \u00b7 ") };
}

const COMPASS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

function setHtml(elem, html) {
  // Only our own strings with <b> tags go through here; all data values are numbers or times.
  elem.innerHTML = html;
}

function messageFor(failed, what) {
  return el("div", "wx-message" + (failed ? " problem" : ""), failed ? `${what} unavailable \u2014 retrying` : `Loading ${what.toLowerCase()}\u2026`);
}

function asOf(data, now) {
  return data && now - data.fetchedAt > WEATHER_STALE_MS ? ` (as of ${shortTime(data.fetchedAt)})` : "";
}

function renderWeather(now) {
  const day = practiceDay(now);
  const start = atMinutes(day, PRACTICE_HOURS.from), end = atMinutes(day, PRACTICE_HOURS.until);

  // Tides
  document.getElementById("tide-label").textContent =
    `Tides during practice \u00b7 ${sameDay(start, now) ? "today" : "tomorrow"} ${shortTime(start)}\u2013${shortTime(end)}`;
  const tideBody = document.getElementById("tide-body");
  const tideEvents = document.getElementById("tide-events");
  if (state.tides && state.tides.curve.length) {
    const { headline, detail } = tideSummary(state.tides, start, end);
    const d = el("div", "wx-detail");
    setHtml(d, detail + asOf(state.tides, now));
    tideBody.replaceChildren(el("div", "wx-headline", headline), d);
    const upcoming = state.tides.events.filter(e => e.time >= now).slice(0, 4);
    setHtml(tideEvents, "Next: " + upcoming.map(e =>
      `<span>${e.type === "high" ? "High" : "Low"} <b>${shortTime(e.time)}</b> ${feet(e.ft)}</span>`).join(" \u00b7 "));
  } else {
    tideBody.replaceChildren(messageFor(state.tidesFailed, "Tides"));
    tideEvents.textContent = "";
  }
  drawTideChart(day, now);

  // Sun
  const sun = sunTimes(day);
  const sunBody = document.getElementById("sun-body");
  const sunDetail = el("div", "wx-detail");
  setHtml(sunDetail, `First light <b>${shortTime(sun.firstLight)}</b> \u00b7 Sunset <b>${shortTime(sun.sunset)}</b>`);
  const parts = [el("div", "wx-big", shortTime(sun.sunrise)), sunDetail];
  if (state.weather) {
    const c = state.weather.current;
    const nowLine = el("div", "wx-detail");
    setHtml(nowLine, `Now <b>${Math.round(c.tempF)}\u00b0F</b> \u00b7 Wind <b>${Math.round(c.windMph)} mph</b> from ${COMPASS[Math.round(c.windFromDeg / 45) % 8]}`);
    parts.push(nowLine);
  }
  sunBody.replaceChildren(...parts);

  // Rain
  const rainBody = document.getElementById("rain-body");
  const bars = document.getElementById("rain-bars");
  const labels = document.getElementById("rain-hours");
  if (state.weather) {
    const { hours, headline, detail } = rainSummary(state.weather.hourly, now);
    const d = el("div", "wx-detail");
    setHtml(d, detail + asOf(state.weather, now));
    rainBody.replaceChildren(el("div", "wx-headline", headline), d);
    bars.replaceChildren(...hours.map(h => {
      const bar = el("div", "rain-bar" + (h.rainPct >= RAIN_LIKELY_PCT ? " likely" : h.rainPct >= RAIN_POSSIBLE_PCT ? " possible" : ""));
      const fill = el("i");
      fill.style.height = Math.max(h.rainPct, 2) + "%";
      bar.append(fill);
      return bar;
    }));
    labels.replaceChildren(...hours.map((h, i) => {
      const p = zoneParts(h.time);
      return el("span", "", i % 6 === 0 ? (p.hour % 12 || 12) + (p.hour < 12 ? "a" : "p") : "");
    }));
  } else {
    rainBody.replaceChildren(messageFor(state.weatherFailed, "Forecast"));
    bars.replaceChildren();
    labels.replaceChildren();
  }
}

// Tide height from 4 to 11 AM on the practice day, with practice shaded.
const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function drawTideChart(day, now) {
  const host = document.getElementById("tide-chart");
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H || !state.tides) { host.replaceChildren(); return; }
  const t0 = atMinutes(day, TIDE_CHART_HOURS.from), t1 = atMinutes(day, TIDE_CHART_HOURS.until);
  const points = state.tides.curve.filter(p => p.time >= t0 && p.time <= t1);
  if (points.length < 2) { host.replaceChildren(); return; }
  const font = Math.min(innerWidth, innerHeight) * 0.024;
  // Room above for labels on highs, below for labels on lows and the hour labels.
  const pad = { l: font * 3.2, r: font * 0.5, t: font * 2.4, b: font * 3.6 };
  const lo = Math.min(...points.map(p => p.ft)) - 0.4, hi = Math.max(...points.map(p => p.ft)) + 0.4;
  const x = t => pad.l + (t - t0) / (t1 - t0) * (W - pad.l - pad.r);
  const y = v => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const muted = "#8da2c0", accent = "#4da3ff";
  const out = svg("svg", { viewBox: `0 0 ${W} ${H}`, "font-size": font, "font-family": "inherit" });

  // Practice window
  const ps = atMinutes(day, PRACTICE_HOURS.from), pe = atMinutes(day, PRACTICE_HOURS.until);
  out.append(svg("rect", { x: x(ps), y: pad.t, width: x(pe) - x(ps), height: H - pad.t - pad.b, fill: "rgba(77,163,255,0.14)", rx: font * 0.3 }));
  // Label at the bottom of the band, or the top if a low tide's label is down there.
  const lowInPractice = state.tides.events.some(e => e.type === "low" && e.time >= ps && e.time <= pe);
  out.append(svg("text", { x: (x(ps) + x(pe)) / 2, y: lowInPractice ? pad.t + font * 1.2 : H - pad.b - font * 0.5,
    fill: accent, "text-anchor": "middle", "font-weight": 700 }, "Practice"));

  // Height gridlines (whole feet)
  const step = hi - lo > 6 ? 2 : 1;
  for (let v = Math.ceil(lo); v <= Math.floor(hi); v += step) {
    out.append(svg("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: "rgba(255,255,255,0.08)" }));
    out.append(svg("text", { x: pad.l - font * 0.4, y: y(v) + font * 0.35, fill: muted, "text-anchor": "end" }, (v < 0 ? "\u2212" : "") + Math.abs(v) + " ft"));
  }

  // Hour labels
  // Hour labels, leaving out the two ends so nothing crowds the edges.
  for (let m = TIDE_CHART_HOURS.from + 60; m < TIDE_CHART_HOURS.until; m += 60) {
    const h = m / 60;
    out.append(svg("text", { x: x(atMinutes(day, m)), y: H - font * 0.4, fill: muted, "text-anchor": "middle" }, (h % 12 || 12) + (h < 12 ? " AM" : " PM")));
  }

  // Curve and area under it
  const line = points.map((p, i) => (i ? "L" : "M") + x(p.time).toFixed(1) + " " + y(p.ft).toFixed(1)).join(" ");
  const base = H - pad.b;
  out.append(svg("path", { d: `${line} L${x(points[points.length - 1].time).toFixed(1)} ${base} L${x(points[0].time).toFixed(1)} ${base} Z`, fill: "rgba(77,163,255,0.10)" }));
  out.append(svg("path", { d: line, fill: "none", stroke: accent, "stroke-width": font * 0.25, "stroke-linejoin": "round" }));

  // Highs and lows in range
  for (const e of state.tides.events.filter(e => e.time >= t0 && e.time <= t1)) {
    const ex = x(e.time), ey = y(e.ft), above = e.type === "high";
    out.append(svg("circle", { cx: ex, cy: ey, r: font * 0.35, fill: "#f2f6ff" }));
    const anchor = ex < W * 0.2 ? "start" : ex > W * 0.8 ? "end" : "middle";
    out.append(svg("text", { x: ex, y: above ? ey - font * 0.8 : ey + font * 1.6, fill: "#f2f6ff", "text-anchor": anchor, "font-weight": 700 },
      `${above ? "High" : "Low"} ${shortTime(e.time)} \u00b7 ${feet(e.ft)}`));
  }

  // Now
  if (now >= t0 && now <= t1) {
    out.append(svg("line", { x1: x(now), x2: x(now), y1: pad.t, y2: base, stroke: "#ffd34d", "stroke-width": font * 0.12, "stroke-dasharray": `${font * 0.4} ${font * 0.3}` }));
    out.append(svg("text", { x: x(now) + font * 0.3, y: base - font * 0.4, fill: "#ffd34d", "font-weight": 700 }, "now"));
  }
  host.replaceChildren(out);
}

// Redraw the chart when its box changes size.
new ResizeObserver(() => { if (state.shownScreen === "weather") drawTideChart(practiceDay(Date.now()), Date.now()); })
  .observe(document.getElementById("tide-chart"));

// =============================================================================
// Fitting: CSS sizes the numbers; this only corrects what CSS can't know
// =============================================================================
// How much a platform's content needs to shrink to fit (1 = fits).
function overflowScale(platEl) {
  let scale = 1;
  for (const col of platEl.querySelectorAll(".trains")) {
    scale = Math.min(scale, col.clientHeight / Math.max(col.scrollHeight, 1));
    for (const row of col.querySelectorAll(".train")) {
      scale = Math.min(scale, row.clientWidth / Math.max(row.scrollWidth, 1));
    }
  }
  return scale;
}

// Same formula as the --num-base/--now-base CSS, in pixels, for browsers
// without container units.
function sizeWithoutContainerUnits(platEl) {
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const side = 3.6 * vmin + 0.8 * innerWidth / 100;
  const style = getComputedStyle(platEl);
  const rows = parseFloat(style.getPropertyValue("--rows")) || MIN_ROWS;
  const ratio = parseFloat(style.getPropertyValue("--ratio")) || WIDTH_RATIO;
  for (const col of platEl.querySelectorAll(".trains")) {
    const num = Math.min((col.clientHeight / rows - 1.6 * vmin - 1) / 0.95, (col.clientWidth - side) / ratio);
    const now = Math.min(num * 0.72, (col.clientWidth - side) / 2.3);
    col.style.setProperty("--num-base", Math.max(num, 8) + "px");
    col.style.setProperty("--now-base", Math.max(now, 8) + "px");
  }
}

// Start from the CSS size; if anything still overflows (text zoom, odd fonts),
// scale down by the measured overflow. Usually one measurement, at most a few.
function fitPlatform(platEl) {
  if (!USE_CONTAINER_UNITS) sizeWithoutContainerUnits(platEl);
  let fit = 1;
  platEl.style.setProperty("--fit", fit);
  for (let i = 0; i < 4; i++) {
    const scale = overflowScale(platEl);
    if (scale >= 0.999) break;
    fit *= scale * 0.98;
    platEl.style.setProperty("--fit", fit.toFixed(4));
  }
}

// Column headers switch to short codes (BERY, DUB, ...) when the full name
// doesn't fit, and shrink if even the short code doesn't fit.
function fitHeaders() {
  for (const head of document.querySelectorAll(".col-head")) {
    const name = head.querySelector(".name");
    head.style.fontSize = "";
    name.textContent = name.dataset.full;
    if (head.scrollWidth <= head.clientWidth) continue;
    name.textContent = name.dataset.short;
    let size = parseFloat(getComputedStyle(head).fontSize);
    while (head.scrollWidth > head.clientWidth && size > 8) {
      size *= 0.92;
      head.style.fontSize = size + "px";
    }
  }
}

function fitAll() {
  fitHeaders();
  for (const platEl of document.querySelectorAll(".platform")) fitPlatform(platEl);
}

// Refit whenever a column changes size: window resize, rotation, divider drag,
// or the ticker appearing/disappearing.
let fitFrame = 0;
const columnObserver = new ResizeObserver(() => {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitAll);
});
for (const col of document.querySelectorAll(".trains")) columnObserver.observe(col);

// =============================================================================
// Ticker
// =============================================================================
let tickerAnimation = null;

function setTicker(messages) {
  const ticker = document.getElementById("ticker");
  const textEl = document.getElementById("ticker-text");
  const text = messages.length ? "⚠ " + messages.join("     •     ") : "";
  if (text === textEl.textContent && ticker.hidden === !text) return;   // unchanged: keep scrolling smoothly
  textEl.textContent = text;
  ticker.hidden = !text;
  startTickerScroll();
}

// Scroll only if the text is wider than the strip; short messages stay still.
function startTickerScroll() {
  const ticker = document.getElementById("ticker");
  const textEl = document.getElementById("ticker-text");
  if (tickerAnimation) { tickerAnimation.cancel(); tickerAnimation = null; }
  if (ticker.hidden) return;
  const boxWidth = ticker.clientWidth;
  const textWidth = textEl.scrollWidth;
  if (textWidth <= boxWidth) return;
  const speed = TICKER_SPEED_VMIN_PER_S * Math.min(innerWidth, innerHeight) / 100;
  // First pass starts with the text already visible at the left edge;
  // after that it loops in from the right edge.
  const firstPass = textEl.animate(
    [{ transform: "translateX(0)" }, { transform: `translateX(${-textWidth}px)` }],
    { duration: textWidth / speed * 1000 }
  );
  tickerAnimation = firstPass;
  firstPass.onfinish = () => {
    if (tickerAnimation !== firstPass) return;   // restarted in the meantime
    tickerAnimation = textEl.animate(
      [{ transform: `translateX(${boxWidth}px)` }, { transform: `translateX(${-textWidth}px)` }],
      { duration: (boxWidth + textWidth) / speed * 1000, iterations: Infinity }
    );
  };
}

// Restart the scroll if the strip changes width (rotation, resize).
let tickerWidth = 0;
new ResizeObserver(entries => {
  const width = Math.round(entries[0].contentRect.width);
  if (width && width !== tickerWidth) {
    tickerWidth = width;
    startTickerScroll();
  }
}).observe(document.getElementById("ticker"));

// =============================================================================
// Draggable divider
// =============================================================================
// Drag (or use arrow keys) to change how much room Platform 1 gets. Double-tap
// resets to the default. The position is remembered on this device. Only the
// --split value changes; the columns' ResizeObserver takes care of refitting.
const mainEl = document.querySelector("main");
const divider = document.getElementById("divider");

function setSplit(value, save) {
  const split = Math.min(0.75, Math.max(0.15, value));
  mainEl.style.setProperty("--split", split.toFixed(4));
  if (save) {
    try { localStorage.setItem(SPLIT_KEY, String(split)); } catch (e) { /* storage unavailable */ }
  }
}

function savedSplit() {
  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    return isNaN(v) ? DEFAULT_SPLIT : v;
  } catch (e) {
    return DEFAULT_SPLIT;
  }
}

function splitAt(clientX, clientY) {
  const portrait = matchMedia("(orientation: portrait)").matches;
  const box = mainEl.getBoundingClientRect();
  const cs = getComputedStyle(mainEl);
  const divSpace = divider.getBoundingClientRect()[portrait ? "height" : "width"] +
                   2 * parseFloat(getComputedStyle(divider)[portrait ? "marginTop" : "marginLeft"]);
  const start = portrait ? box.top + parseFloat(cs.paddingTop) : box.left + parseFloat(cs.paddingLeft);
  const size = (portrait ? box.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                         : box.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) - divSpace;
  const pos = (portrait ? clientY : clientX) - start - divSpace / 2;
  return pos / size;
}

divider.addEventListener("pointerdown", e => {
  divider.setPointerCapture(e.pointerId);
  divider.classList.add("dragging");
  e.preventDefault();
});
divider.addEventListener("pointermove", e => {
  if (divider.hasPointerCapture(e.pointerId)) setSplit(splitAt(e.clientX, e.clientY), false);
});
divider.addEventListener("pointerup", e => {
  if (!divider.classList.contains("dragging")) return;
  divider.classList.remove("dragging");
  setSplit(splitAt(e.clientX, e.clientY), true);
});
divider.addEventListener("pointercancel", () => divider.classList.remove("dragging"));
divider.addEventListener("dblclick", () => setSplit(DEFAULT_SPLIT, true));
divider.addEventListener("keydown", e => {
  const step = { ArrowLeft: -0.02, ArrowUp: -0.02, ArrowRight: 0.02, ArrowDown: 0.02 }[e.key];
  if (step === undefined) return;
  e.preventDefault();
  const current = parseFloat(getComputedStyle(mainEl).getPropertyValue("--split")) || DEFAULT_SPLIT;
  setSplit(current + step, true);
});

// =============================================================================
// Auto-update: reload when a new version of this page is published
// =============================================================================
// Fetch this page's own file and compare it to the version that was current
// when the page loaded. Failed checks are ignored, so the kiosk never reloads
// into an error page.
let loadedVersion = null;

async function checkForUpdate() {
  try {
    const url = location.href.split("#")[0];
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    if (!text.includes("<title>Fruitvale BART Departures</title>")) return;
    if (loadedVersion === null) {
      loadedVersion = text;
    } else if (text !== loadedVersion) {
      location.reload();
    }
  } catch (err) {
    console.log("Update check failed:", err.message);
  }
}

// =============================================================================
// Timers: all in one place. A job is skipped if its previous run is still going.
// =============================================================================
function every(ms, job) {
  let running = false;
  const run = async () => {
    if (running) return;
    running = true;
    try { await job(); } finally { running = false; }
  };
  run();
  return setInterval(run, ms);
}

function tickClock() {
  document.getElementById("clock").textContent = formatTime(new Date(), false);
  if (activeScreen() !== state.shownScreen) render();   // schedule or a manual switch changed the screen
}

document.getElementById("screen-toggle").addEventListener("click", toggleScreen);

setSplit(savedSplit(), false);
every(1000, tickClock);
every(DEPARTURES_EVERY_MS, updateDepartures);
every(ADVISORIES_EVERY_MS, updateAdvisories);
every(WEATHER_EVERY_MS, updateWeather);
every(TIDES_EVERY_MS, updateTides);
every(UPDATE_CHECK_EVERY_MS, checkForUpdate);
</script>
</body>
