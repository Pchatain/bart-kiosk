<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://api.bart.gov; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fruitvale BART Departures</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #141e33;
    --text: #f2f6ff;
    --muted: #8da2c0;
    --accent: #4da3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 2vmin 3vw 1vmin;
  }
  header h1 {
    font-size: 5vmin;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  #clock {
    font-size: 4.5vmin;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  main {
    /* --split: Platform 1's share of the width (0.25 = 25%). Set by dragging the divider. */
    --split: 0.25;
    --div-space: 4vmin;    /* divider width + its margins */
    flex: 1;
    display: flex;
    padding: 0 2vw 1vmin;
    min-height: 0;
  }
  .platform {
    flex: 1 1 0;
    min-width: 0;
    background: var(--panel);
    border-radius: 1.5vmin;
    padding: 1.5vmin 1.5vw;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .platform.p1 { flex: 0 0 calc((100% - var(--div-space)) * var(--split)); }
  #divider {
    flex: 0 0 1.6vmin;
    margin: 0 1.2vmin;
    background: #2f4268;
    border-radius: 0.8vmin;
    position: relative;
    cursor: col-resize;
    touch-action: none;
    user-select: none;
  }
  /* Wider invisible touch target so the divider is easy to grab. */
  #divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2.5vmin; right: -2.5vmin; }
  /* Grip mark in the middle. */
  #divider::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 0.5vmin; height: 9vmin;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.45);
    border-radius: 0.2vmin;
  }
  #divider.dragging, #divider:focus-visible { background: var(--accent); outline: none; }
  .cols {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  /* Thin gray line between the two columns in each half. */
  .col:first-child { padding-right: 1.2vw; }
  .col + .col { padding-left: 1.2vw; border-left: 2px solid rgba(255,255,255,0.14); }
  .col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .col-head .plat { color: var(--accent); margin-right: 0.5em; }
  .col-head {
    font-size: 2.8vmin;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-bottom: 0.6vmin;
    border-bottom: 2px solid rgba(255,255,255,0.12);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trains { flex: 1; overflow: hidden; }
  .train {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    padding: 0.8vmin 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .train:last-child { border-bottom: none; }
  .line-dot {
    width: 3.6vmin;
    height: 3.6vmin;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.35);
  }
  .dest {
    flex: 1;
    min-width: 0;
    font-size: 4.4vmin;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Each number sits right next to its dot, in a slot two digits wide and
     right-aligned, so "9" lines up under the "6" of "16". */
  .mins {
    min-width: 2ch;
    /* Landscape: sized so 4 rows fit per column (17% of height), capped so
       "88" plus the dot fit a column (a quarter of the width). On landscape
       screens vmin is the height, so this is min(17vh, 12.5vw). */
    /* The script sets --num per column to the largest size that fits 4 rows;
       this fallback is only used if the script hasn't run. */
    font-size: var(--num, min(17vmin, 12.5vw));
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .mins.leaving { color: #ffd34d; font-size: var(--now, min(12vmin, 7.5vw)); }
  .empty, .error {
    font-size: 2.8vmin;
    color: var(--muted);
    padding: 3vmin 0;
    text-align: center;
  }
  .error { color: #ff8a80; }
  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 2vw;
    padding: 0.8vmin 3vw 1.2vmin;
    font-size: 1.8vmin;
    color: var(--muted);
  }
  footer .tag { letter-spacing: 0.15em; }
  #updated { text-align: right; }
  /* Portrait screens: stack the platforms; the divider drags up and down. */
  @media (orientation: portrait) {
    main { flex-direction: column; }
    .platform.p1 { flex-basis: calc((100% - var(--div-space)) * var(--split)); }
    #divider { margin: 1.2vmin 0; cursor: row-resize; }
    #divider::before { left: 0; right: 0; top: -2.5vmin; bottom: -2.5vmin; }
    #divider::after { width: 9vmin; height: 0.5vmin; }
  }
</style>
</head>
<body>
  <header>
    <h1>Fruitvale <span>BART</span></h1>
    <div id="clock">--:--</div>
  </header>
  <main>
    <section class="platform p1" aria-label="Platform 1">
      <div class="cols">
        <div class="col"><div class="col-head"><span class="plat">#1</span><span class="name" data-full="Berryessa" data-short="BERY">Berryessa</span></div><div class="trains" id="col-bery"><div class="empty">Loading&hellip;</div></div></div>
        <div class="col"><div class="col-head"><span class="name" data-full="Dublin" data-short="DUB">Dublin</span></div><div class="trains" id="col-dub"><div class="empty">Loading&hellip;</div></div></div>
      </div>
    </section>
    <div id="divider" role="separator" aria-label="Drag to resize platforms" tabindex="0"></div>
    <section class="platform p2" aria-label="Platform 2">
      <div class="cols">
        <div class="col"><div class="col-head"><span class="plat">#2</span><span class="name" data-full="San Francisco" data-short="SF">San Francisco</span></div><div class="trains" id="col-sf"><div class="empty">Loading&hellip;</div></div></div>
        <div class="col"><div class="col-head"><span class="name" data-full="Richmond" data-short="RICH">Richmond</span></div><div class="trains" id="col-rich"><div class="empty">Loading&hellip;</div></div></div>
      </div>
    </section>
  </main>
  <footer>
    <div>Departures within the next 60 minutes</div>
    <div class="tag">GCCRCNPO!</div>
    <div id="updated">Updating&hellip;</div>
  </footer>

<script>
// BART's published public demo key. Anything in client-side JS is public; don't put a private key here.
const API_URL ="https://api.bart.gov/api/etd.aspx?cmd=etd&orig=FTVL&key=MW9S-E7SL-26DU-VV8V&json=y";
const MAX_MINUTES = 60;
const REFRESH_MS = 30000;

// Short codes for destinations, keyed by the name the BART API returns.
// Any destination not listed here is shown with its full name.
const SHORT_NAMES = {
  "Berryessa": "BERY",
  "Berryessa/North San Jose": "BERY",
  "Dublin/Pleasanton": "DUB",
  "Daly City": "DALY",
  "Richmond": "RICH"
};

// Which column each train goes in. A train goes in the first column on its
// platform that lists its destination; anything unlisted goes in that
// platform's fallback column. Rows show only the line-color dot and minutes;
// the destination name appears only for a train the column doesn't list.
const COLUMNS = [
  { id: "col-bery", platform: "1", dests: ["Berryessa", "Berryessa/North San Jose"], fallback: true },
  { id: "col-dub",  platform: "1", dests: ["Dublin/Pleasanton"] },
  { id: "col-sf",   platform: "2", dests: ["Daly City", "SF Airport"], fallback: true },
  { id: "col-rich", platform: "2", dests: ["Richmond"] }
];

function columnFor(platform, destination) {
  const onPlatform = COLUMNS.filter(c => c.platform === platform);
  return onPlatform.find(c => c.dests.includes(destination)) ||
         onPlatform.find(c => c.fallback) || null;
}

function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
setInterval(tickClock, 1000);
tickClock();

function div(className, text) {
  const d = document.createElement("div");
  d.className = className;
  if (text !== undefined) d.textContent = text;
  return d;
}

function renderColumn(el, trains) {
  if (!trains.length) {
    el.replaceChildren(div("empty", "No trains"));
    return;
  }
  el.replaceChildren(...trains.map(t => {
    const row = div("train");

    const dot = div("line-dot");
    dot.style.background = /^#[0-9a-fA-F]{3,8}$/.test(t.hexcolor) ? t.hexcolor : "#888";

    let mins;
    if (t.minutes === 0) {
      mins = div("mins leaving", "Now");
    } else {
      mins = div("mins", String(t.minutes));
    }

    if (t.showDest) {
      row.append(dot, div("dest", t.destination), mins);
    } else {
      row.append(dot, mins);
    }
    return row;
  }));
}

// ---- Sizing -------------------------------------------------------------
// Each column gets the largest numbers that fit ROWS_TO_FIT rows in its
// height and "88" (plus the dot) in its width. The columns can be different
// widths (the divider is draggable), so this is measured per column. After
// sizing, it checks what actually rendered and shrinks until it fits, which
// also covers browser text-zoom settings the math can't see.
const ROWS_TO_FIT = 4;

function rowsFit(el, n) {
  const box = el.getBoundingClientRect();
  const rows = [...el.querySelectorAll(".train")].slice(0, n);
  for (const row of rows) {
    if (row.getBoundingClientRect().bottom > box.bottom + 1) return false;
    const mins = row.querySelector(".mins");
    const dot = row.querySelector(".line-dot");
    const range = document.createRange();
    range.selectNodeContents(mins);
    const text = range.getBoundingClientRect();
    if (text.right > box.right + 1 || text.left < dot.getBoundingClientRect().right + 1) return false;
  }
  return true;
}

function fitColumn(el) {
  const rows = el.querySelectorAll(".train");
  if (!rows.length) return Infinity;
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const side = 3.6 * vmin + 0.8 * innerWidth / 100 + 4;   // dot + gap + slack
  const rowExtra = 1.6 * vmin + 1;                         // row padding + divider line
  let num = Math.min((el.clientHeight / ROWS_TO_FIT - rowExtra) / 0.95,
                     (el.clientWidth - side) / 1.3);
  const n = Math.min(ROWS_TO_FIT, rows.length);
  for (let i = 0; i < 25; i++) {
    setColumnSize(el, num);
    if (num <= 8 || rowsFit(el, n)) break;
    num *= 0.95;
  }
  return num;
}

function setColumnSize(el, num) {
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const side = 3.6 * vmin + 0.8 * innerWidth / 100 + 4;
  const now = Math.min(num * 0.72, (el.clientWidth - side) / 2.3);
  el.style.setProperty("--num", Math.max(num, 8) + "px");
  el.style.setProperty("--now", Math.max(now, 8) + "px");
}

// Drop rows that don't fully fit rather than showing half a row.
function dropOverflowRows(el) {
  const bottom = el.getBoundingClientRect().bottom;
  for (const row of [...el.querySelectorAll(".train")]) {
    if (row.getBoundingClientRect().bottom > bottom + 1) row.remove();
  }
}

// Column headers switch to short codes (BERY, DUB, ...) when the full name
// doesn't fit, and shrink if even the short code doesn't fit.
function fitHeaders() {
  for (const head of document.querySelectorAll(".col-head")) {
    const name = head.querySelector(".name");
    head.style.fontSize = "";
    name.textContent = name.dataset.full;
    if (head.scrollWidth <= head.clientWidth) continue;
    name.textContent = name.dataset.short;
    let size = parseFloat(getComputedStyle(head).fontSize);
    while (head.scrollWidth > head.clientWidth && size > 8) {
      size *= 0.92;
      head.style.fontSize = size + "px";
    }
  }
}

let lastTrains = null;   // trains per column from the most recent refresh

function layout() {
  fitHeaders();
  if (!lastTrains) return;
  for (const c of COLUMNS) renderColumn(document.getElementById(c.id), lastTrains[c.id]);
  // Both columns on a platform use the same size: the smaller of their best fits.
  for (const platform of ["1", "2"]) {
    const els = COLUMNS.filter(c => c.platform === platform).map(c => document.getElementById(c.id));
    const num = Math.min(...els.map(fitColumn));
    for (const el of els) {
      if (isFinite(num)) setColumnSize(el, num);
      dropOverflowRows(el);
    }
  }
}

async function refresh() {
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const etds = (data.root.station && data.root.station[0] && data.root.station[0].etd) || [];

    const byColumn = {};
    for (const c of COLUMNS) byColumn[c.id] = [];
    for (const etd of etds) {
      for (const est of etd.estimate) {
        if (est.cancelflag === "1") continue;
        const minutes = est.minutes === "Leaving" ? 0 : parseInt(est.minutes, 10);
        if (isNaN(minutes) || minutes > MAX_MINUTES) continue;
        const col = columnFor(est.platform, etd.destination);
        if (!col) continue;
        byColumn[col.id].push({
          destination: SHORT_NAMES[etd.destination] || etd.destination,
          showDest: !col.dests.includes(etd.destination),
          minutes,
          hexcolor: est.hexcolor || "#888"
        });
      }
    }
    for (const c of COLUMNS) byColumn[c.id].sort((a, b) => a.minutes - b.minutes);
    lastTrains = byColumn;
    layout();

    document.getElementById("updated").textContent =
      "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    document.getElementById("updated").textContent = "Update failed — retrying";
    console.log("Refresh error:", err.message);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);

// ---- Draggable divider --------------------------------------------------
// Drag (or use arrow keys) to change how much room Platform 1 gets.
// Double-tap resets to the default. The position is remembered on this device.
const DEFAULT_SPLIT = 0.25;
const SPLIT_KEY = "kiosk-split";
const mainEl = document.querySelector("main");
const divider = document.getElementById("divider");

function setSplit(value, save) {
  const split = Math.min(0.75, Math.max(0.15, value));
  mainEl.style.setProperty("--split", split.toFixed(4));
  if (save) {
    try { localStorage.setItem(SPLIT_KEY, String(split)); } catch (e) { /* storage unavailable */ }
  }
  layout();
}

function savedSplit() {
  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    return isNaN(v) ? DEFAULT_SPLIT : v;
  } catch (e) {
    return DEFAULT_SPLIT;
  }
}

function splitAt(clientX, clientY) {
  const portrait = matchMedia("(orientation: portrait)").matches;
  const box = mainEl.getBoundingClientRect();
  const cs = getComputedStyle(mainEl);
  const divSpace = divider.getBoundingClientRect()[portrait ? "height" : "width"] +
                   2 * parseFloat(getComputedStyle(divider)[portrait ? "marginTop" : "marginLeft"]);
  const start = portrait ? box.top + parseFloat(cs.paddingTop) : box.left + parseFloat(cs.paddingLeft);
  const size = (portrait ? box.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                         : box.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) - divSpace;
  const pos = (portrait ? clientY : clientX) - start - divSpace / 2;
  return pos / size;
}

let dragFrame = 0;
divider.addEventListener("pointerdown", e => {
  divider.setPointerCapture(e.pointerId);
  divider.classList.add("dragging");
  e.preventDefault();
});
divider.addEventListener("pointermove", e => {
  if (!divider.hasPointerCapture(e.pointerId)) return;
  const x = e.clientX, y = e.clientY;
  cancelAnimationFrame(dragFrame);
  dragFrame = requestAnimationFrame(() => setSplit(splitAt(x, y), false));
});
function endDrag(e) {
  if (!divider.classList.contains("dragging")) return;
  divider.classList.remove("dragging");
  cancelAnimationFrame(dragFrame);
  setSplit(splitAt(e.clientX, e.clientY), true);
}
divider.addEventListener("pointerup", endDrag);
divider.addEventListener("pointercancel", () => divider.classList.remove("dragging"));
divider.addEventListener("dblclick", () => setSplit(DEFAULT_SPLIT, true));
divider.addEventListener("keydown", e => {
  const step = { ArrowLeft: -0.02, ArrowUp: -0.02, ArrowRight: 0.02, ArrowDown: 0.02 }[e.key];
  if (step === undefined) return;
  e.preventDefault();
  const current = parseFloat(getComputedStyle(mainEl).getPropertyValue("--split")) || DEFAULT_SPLIT;
  setSplit(current + step, true);
});

let resizeFrame = 0;
addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(layout);
});

setSplit(savedSplit(), false);

// Reload the page when a new version of it is published.
// Every few minutes, fetch this page's own file and compare it to the version
// that was current when the page loaded. Failed checks (network down, server
// error) are ignored, so the kiosk never reloads into an error page.
const UPDATE_CHECK_MS = 5 * 60 * 1000;
let loadedVersion = null;

async function checkForUpdate() {
  try {
    const url = location.href.split("#")[0];
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    if (!text.includes("<title>Fruitvale BART Departures</title>")) return;
    if (loadedVersion === null) {
      loadedVersion = text;
    } else if (text !== loadedVersion) {
      location.reload();
    }
  } catch (err) {
    console.log("Update check failed:", err.message);
  }
}

checkForUpdate();
setInterval(checkForUpdate, UPDATE_CHECK_MS);
</script>
</body>
</html>
